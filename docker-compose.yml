services:
  db:
    image: postgres:17-alpine
    container_name: anncsu-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - anncsu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: anncsu-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:10010:8000"
    volumes:
      - .:/app
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--timeout",
        "60"
      ]

volumes:
  anncsu-postgres-data:
    name: anncsu-postgres-data
